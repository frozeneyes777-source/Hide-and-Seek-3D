</head><body>
<div id="ui">
  <section id="lobby"><div id="card" class="glass"><div class="title">Duo Hide & Seek 3D</div><div class="sub">Mobile 3D multiplayer prototype · FPP / TPP</div><div class="row"><button id="create" class="primary">CREATE ROOM</button></div><div style="height:10px"></div><div class="row"><input id="joinCode" maxlength="6" placeholder="ROOM CODE"/><button id="join">JOIN</button></div><div id="msg"></div><div class="small">Host = hider · Guest = seeker in this prototype.</div></div></section>

</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const SB_URL='https://csofjqnkixaqflicdpnb.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzb2ZqcW5raXhhcWZsaWNkcG5iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNDQ5NDIsImV4cCI6MjEwMjkyMDk0Mn0.b7BSNzKIXR2rSEGBQ_dbbYWmmmDHjzEBv2jJ5oVvTCc';
const headers={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'};
const $=s=>document.querySelector(s); const me=crypto.randomUUID?.()||Math.random().toString(36).slice(2)+Date.now();

async function req(path,opt={}){const r=await fetch(SB_URL+'/rest/v1/'+path,{...opt,cache:'no-store',headers:{...headers,...(opt.headers||{})}});const t=await r.text();const d=t?JSON.parse(t):null;if(!r.ok)throw Error(d?.message||'HTTP '+r.status);return d}

const rand=()=>Math.random().toString(36).slice(2,8).toUpperCase();
async function update(o){return req('hide_seek_rooms?code=eq.'+encodeURIComponent(code),{method:'PATCH',body:JSON.stringify({...o,updated_at:new Date().toISOString()})})}
async function load(){if(!code)return;try{const d=await req('hide_seek_rooms?code=eq.'+encodeURIComponent(code)+'&select=*');if(d?.[0]){room=d[0];syncRoom()}}catch(e){toast('Reconnecting…')}}
function startPoll(){clearInterval(poller);load();poller=setInterval(load,150)}
$('#create').onclick=async()=>{try{code=rand();isHost=true;$('#msg').textContent='Creating…';await req('hide_seek_rooms',{method:'POST',body:JSON.stringify({code,host_id:me,hider_id:me,status:'waiting',host_x:0,host_y:5.2,host_skin:'boy_blue',round:1,search_chances:3,map_theme:'3dhouse'})});$('#msg').textContent='Room '+code+' — share code';startPoll()}catch(e){$('#msg').textContent=e.message}};
$('#join').onclick=async()=>{try{code=$('#joinCode').value.trim().toUpperCase();if(!code)return;const d=(await req('hide_seek_rooms?code=eq.'+encodeURIComponent(code)+'&select=*'))?.[0];if(!d){$('#msg').textContent='Room not found';return}isHost=false;await update({guest_id:me,seeker_id:me,status:'hiding',guest_x:0,guest_y:5.2,guest_skin:'girl_pink',hiding_started_at:new Date().toISOString(),search_chances:3,hidden_spot:null,winner_id:null});startPoll()}catch(e){$('#msg').textContent=e.message}};

const scene=new THREE.Scene();scene.background=new THREE.Color(0x91b4c7);scene.fog=new THREE.Fog(0x91b4c7,20,48);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,100);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x536056,1.35));const sun=new THREE.DirectionalLight(0xffffff,1.8);sun.position.set(9,14,7);sun.castShadow=true;scene.add(sun);
function box(x,y,z,w,h,d,c,cast=true){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:.8}));m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=true;scene.add(m);return m}
box(0,-.1,0,18,.2,14,0xc9b58f,false);box(0,-.22,-9,22,.2,6,0x628e55,false);
const coll=[];function wall(x,z,w,d,c=0xf1ece2){box(x,1.5,z,w,3,d,c);coll.push({x,z,w,d})}function furn(x,y,z,w,h,d,c,name,hide=false){box(x,y,z,w,h,d,c);coll.push({x,z,w,d});if(hide)spots.push({x,z,name})}
wall(0,-7,18,.24);wall(-9,0,.24,14);wall(9,0,.24,14);wall(-5.6,7,6.8,.24);wall(5.6,7,6.8,.24);wall(-2.2,-3.3,.22,7.2,0xe7e0d4);wall(3.2,2.2,.22,9.6,0xe7e0d4);wall(-5.5,2.1,7,.22,0xe7e0d4);
const spots=[];furn(-5.8,.45,-4.8,3.2,.9,2.1,0x7e5d46,'Bed',true);furn(-.1,1.25,-4.6,1.8,2.5,1.2,0x5c4938,'Wardrobe',true);furn(5.8,.55,-3.7,3.8,1.1,1.5,0x496071,'Sofa',true);furn(5.8,.5,3.9,2.8,1,1.8,0x8b6a42,'Dining Table',true);furn(7.1,1.2,5.5,1.2,2.4,1,0xd8dce0,'Fridge',true);furn(-6.4,.75,4.7,1.5,1.5,1.5,0xb5c2c7,'Laundry',true);furn(-.1,.6,4.8,2.2,1.2,1.3,0x75583c,'Boxes',true);furn(-4.8,.35,-10.2,2.6,.7,1.2,0x7d6345,'Garden Bench',true);furn(4.5,1,-10.2,.6,2,.6,0x5c402a,'Tree',true);const crown=new THREE.Mesh(new THREE.SphereGeometry(1.7,18,14),new THREE.MeshStandardMaterial({color:0x4f8e4f}));crown.position.set(4.5,2.8,-10.2);scene.add(crown);
function avatar(color,skin){const g=new THREE.Group();const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.32,.95,6,10),new THREE.MeshStandardMaterial({color}));torso.position.y=1;g.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.28,16,12),new THREE.MeshStandardMaterial({color:skin}));head.position.y=1.75;g.add(head);const hair=new THREE.Mesh(new THREE.SphereGeometry(.29,16,12,0,Math.PI*2,0,Math.PI*.58),new THREE.MeshStandardMaterial({color:0x211c1a}));hair.position.y=1.83;g.add(hair);return g}
const host=avatar(0x2f6bb0,0xe0b391),guest=avatar(0x8c355b,0xe2b598);scene.add(host,guest);host.position.set(0,0,5.2);guest.position.set(0,0,5.2);let local=host,remote=guest;
function collides(x,z){const r=.34;if(x<-8.55||x>8.55||z<-6.6||z>11.7)return true;for(const b of coll){if(x+r>b.x-b.w/2&&x-r<b.x+b.w/2&&z+r>b.z-b.d/2&&z-r<b.z+b.d/2)return true}return false}
function nearestSpot(){let bi=-1,bd=99;spots.forEach((s,i)=>{const d=Math.hypot(local.position.x-s.x,local.position.z-s.z);if(d<bd){bd=d;bi=i}});return bd<2.25?bi:-1}
function syncRoom(){if(!room?.guest_id)return;$('#lobby').classList.add('hidden');$('#hud').style.display='block';$('#room').textContent=room.code;$('#round').textContent=room.round||1;local=isHost?host:guest;remote=isHost?guest:host;const rx=isHost?room.guest_x:room.host_x,rz=isHost?room.guest_y:room.host_y;if(Number.isFinite(rx)&&Number.isFinite(rz)){remote.position.x+=(rx-remote.position.x)*.45;remote.position.z+=(rz-remote.position.z)*.45}
const hider=me===room.hider_id;$('#role').textContent=hider?'HIDER':'SEEKER';$('#chances').textContent=room.search_chances??3;const hidden=isHost?room.host_hidden:room.guest_hidden;const otherHidden=isHost?room.guest_hidden:room.host_hidden;
if(room.status==='hiding'){const left=Math.max(0,30-Math.floor((Date.now()-new Date(room.hiding_started_at||room.updated_at).getTime())/1000));$('#timer').textContent='00:'+String(left).padStart(2,'0');$('#action').textContent=hider?'HIDE':'WAIT';$('#action').disabled=!hider;if(!left&&hider&&!hidden)doHide()}
if(room.status==='seeking'){const left=Math.max(0,120-Math.floor((Date.now()-new Date(room.started_at||room.updated_at).getTime())/1000));$('#timer').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');$('#action').textContent=hider?'HIDDEN':'SEARCH';$('#action').disabled=hider;if(hider&&hidden)local.visible=false;else local.visible=true;if(!hider&&otherHidden)remote.visible=false;if(!left&&!finished)finish(room.hider_id)}
if(room.status==='finished'&&!finished){finished=true;$('#action').disabled=true;const won=room.winner_id===me;toast(won?'🏆 Round won':'😅 Round lost',5000)}}
async function doHide(){if(me!==room?.hider_id)return;const i=nearestSpot();if(i<0){toast('Move near furniture');return}const p=spots[i];const key=isHost?'host_hidden':'guest_hidden',spotKey=isHost?'host_hide_spot':'guest_hide_spot';await update({[key]:true,[spotKey]:p.name,hidden_spot:i+1,status:'seeking',started_at:new Date().toISOString(),search_chances:3});toast('Hidden near '+p.name)}
async function doSearch(){if(me!==room?.seeker_id)return;const i=nearestSpot();if(i<0){toast('Move closer to furniture');return}let chances=Math.max(0,(room.search_chances??3)-1);if(i+1===Number(room.hidden_spot)){await finish(me);toast('FOUND!')}else{await update({search_chances:chances});toast(chances?('Wrong spot · '+chances+' left'):'No searches left');if(!chances)await finish(room.hider_id)}}
async function finish(winner){if(finished||room?.status==='finished')return;finished=true;await update({status:'finished',winner_id:winner})}
$('#action').onclick=()=>{if(room?.status==='hiding')doHide();else if(room?.status==='seeking')doSearch()};
const joy=$('#joy'),stick=$('#stick');function setJoy(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,max=42,len=Math.hypot(dx,dy)||1;if(len>max){dx=dx/len*max;dy=dy/len*max}targetX=dx/max;targetY=-dy/max;stick.style.transform=`translate(${dx}px,${dy}px)`}joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);setJoy(e)});joy.addEventListener('pointermove',e=>{if(joy.hasPointerCapture(e.pointerId))setJoy(e)});function reset(){targetX=targetY=0;stick.style.transform='translate(0,0)'}joy.addEventListener('pointerup',reset);joy.addEventListener('pointercancel',reset);
renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientX<innerWidth*.45)return;lookPointer=e.pointerId;lastLX=e.clientX;lastLY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId!==lookPointer)return;const dx=e.clientX-lastLX,dy=e.clientY-lastLY;lastLX=e.clientX;lastLY=e.clientY;yaw-=dx*.0062;pitch=Math.max(-.85,Math.min(.55,pitch-dy*.0048))});renderer.domElement.addEventListener('pointerup',e=>{if(e.pointerId===lookPointer)lookPointer=null});
$('#camMode').onclick=()=>{mode=mode==='TPP'?'FPP':'TPP';$('#camMode').textContent=mode};
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.033);moveX+=(targetX-moveX)*Math.min(1,dt*12);moveY+=(targetY-moveY)*Math.min(1,dt*12);const canMove=room&&room.guest_id&&room.status!=='finished'&&!(room.status==='hiding'&&me===room.seeker_id)&&!(room.status==='seeking'&&me===room.hider_id&&(isHost?room.host_hidden:room.guest_hidden));if(canMove){const f=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw)),r=new THREE.Vector3(f.z,0,-f.x),speed=3.6,delta=new THREE.Vector3().addScaledVector(f,moveY*speed*dt).addScaledVector(r,moveX*speed*dt);let nx=local.position.x+delta.x,nz=local.position.z+delta.z;if(!collides(nx,local.position.z))local.position.x=nx;if(!collides(local.position.x,nz))local.position.z=nz;if(Math.hypot(moveX,moveY)>.08)local.rotation.y=yaw;if(performance.now()-sendAt>90){sendAt=performance.now();update(isHost?{host_x:local.position.x,host_y:local.position.z}:{guest_x:local.position.x,guest_y:local.position.z}).catch(()=>{})}}
const eye=local.position.clone().add(new THREE.Vector3(0,1.55,0));if(mode==='FPP'){local.visible=false;camera.position.copy(eye).add(new THREE.Vector3(Math.sin(yaw)*.12,0,Math.cos(yaw)*.12));const dir=new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch));camera.lookAt(camera.position.clone().add(dir))}else{if(!(room?.status==='seeking'&&me===room?.hider_id&&(isHost?room.host_hidden:room.guest_hidden)))local.visible=true;const dist=3.5,back=new THREE.Vector3(-Math.sin(yaw)*Math.cos(pitch),Math.sin(-pitch)*1.25,-Math.cos(yaw)*Math.cos(pitch)).multiplyScalar(dist);camera.position.lerp(eye.clone().add(back).add(new THREE.Vector3(0,1.35,0)),.18);camera.lookAt(eye.clone().add(new THREE.Vector3(0,.25,0)))}renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
