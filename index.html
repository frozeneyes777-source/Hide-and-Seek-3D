const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.033);moveX+=(targetX-moveX)*Math.min(1,dt*12);moveY+=(targetY-moveY)*Math.min(1,dt*12);const canMove=room&&room.status!=='finished'&&!(room.status==='hiding'&&me===room.seeker_id)&&!(room.status==='seeking'&&me===room.hider_id&&(isHost?room.host_hidden:room.guest_hidden));if(canMove){const f=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw)),r=new THREE.Vector3(f.z,0,-f.x),speed=3.6,delta=new THREE.Vector3().addScaledVector(f,moveY*speed*dt).addScaledVector(r,moveX*speed*dt);let nx=local.position.x+delta.x,nz=local.position.z+delta.z;if(!collides(nx,local.position.z))local.position.x=nx;if(!collides(local.position.x,nz))local.position.z=nz;if(Math.hypot(moveX,moveY)>.08)local.rotation.y=yaw;if(performance.now()-sendAt>90){sendAt=performance.now();update(isHost?{host_x:local.position.x,host_y:local.position.z}:{guest_x:local.position.x,guest_y:local.position.z}).catch(()=>{})}}
const hiderNow=room&&me===room.hider_id,hiddenNow=room&&(isHost?room.host_hidden:room.guest_hidden),spectating=room?.status==='seeking'&&hiderNow&&hiddenNow;const near=nearestSpot();if(room?.status==='hiding'&&hiderNow){$('#action').style.visibility=near>=0?'visible':'hidden'}else if(room?.status==='seeking'&&!hiderNow){$('#action').style.visibility=near>=0?'visible':'hidden'}else{$('#action').style.visibility='visible'}
const eye=local.position.clone().add(new THREE.Vector3(0,1.55,0));if(spectating){local.visible=false;$('#camMode').textContent='WATCH';const focus=remote.position.clone().add(new THREE.Vector3(0,1,0));camera.position.lerp(focus.clone().add(new THREE.Vector3(0,7.2,6.2)),.12);camera.lookAt(focus)}else if(mode==='FPP'){local.visible=false;$('#camMode').textContent='FPP';camera.position.copy(eye).add(new THREE.Vector3(Math.sin(yaw)*.12,0,Math.cos(yaw)*.12));const dir=new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch));camera.lookAt(camera.position.clone().add(dir))}else{local.visible=true;$('#camMode').textContent='TPP';const dist=3.5,back=new THREE.Vector3(-Math.sin(yaw)*Math.cos(pitch),Math.sin(-pitch)*1.25,-Math.cos(yaw)*Math.cos(pitch)).multiplyScalar(dist);const desired=eye.clone().add(back).add(new THREE.Vector3(0,1.35,0));if(collides(desired.x,desired.z)){desired.lerp(eye,.58)}camera.position.lerp(desired,.18);camera.lookAt(eye.clone().add(new THREE.Vector3(0,.25,0)))}drawMini(spectating);renderer.render(scene,camera)}animate();
function drawMini(spectating){const c=$('#minimap'),x=c.getContext('2d'),W=c.width,H=c.height;x.clearRect(0,0,W,H);x.fillStyle='#0a141dcc';x.fillRect(0,0,W,H);x.strokeStyle='#ffffff55';x.strokeRect(5,5,W-10,H-10);const px=v=>5+(v+9)/18*(W-10),pz=v=>5+(12.7-v)/24.4*(H-10);x.fillStyle='#ffffff22';x.fillRect(px(-1.2),pz(-7)-2,px(1.2)-px(-1.2),4);const draw=(p,color)=>{x.beginPath();x.arc(px(p.x),pz(p.z),4,0,Math.PI*2);x.fillStyle=color;x.fill()};draw(local.position,'#6fb8ff');const remoteHidden=room&&(isHost?room.guest_hidden:room.host_hidden);if(room?.guest_id&&(!remoteHidden||spectating))draw(remote.position,'#ff7fb6')}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
